<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة طلبات التحجيم - العقبة للوجستيات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .badge-tahjeem { background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge-done { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <nav class="bg-blue-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3 space-x-reverse">
        <span class="text-2xl">📦</span>
        <h1 class="text-xl font-bold">نظام طلبات التحجيم (LCL)</h1>
      </div>
      <div class="flex items-center space-x-4 space-x-reverse text-sm">
        <label class="font-semibold text-blue-200">الموظف الحالي:</label>
        <select id="employeeSelect" class="bg-blue-800 border border-blue-700 text-white rounded px-3 py-1 font-bold">
        </select>
        <button onclick="addNewEmployee()" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-xs transition">+ موظف جديد</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg px-4 pt-2 shadow-sm">
      <button onclick="switchTab('cs')" id="tab-cs" class="py-3 px-6 font-bold text-blue-600 border-b-4 border-blue-600 focus:outline-none transition">قسم خدمة العملاء (Customer Service)</button>
      <button onclick="switchTab('warehouse')" id="tab-wh" class="py-3 px-6 font-bold text-gray-500 border-b-4 border-transparent hover:text-blue-600 focus:outline-none transition">شاشة المستودع (شريف - التحجيم)</button>
    </div>

    <!-- قسم خدمة العملاء -->
    <div id="section-cs" class="space-y-6">
      <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
        <h2 class="text-lg font-bold text-blue-900 mb-4 pb-2 border-b border-gray-100 flex items-center justify-between">
          <span>إنشاء طلب تحجيم جديد (حتى 3 بوالص)</span>
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="bls-container">
          <!-- بوليصة 1 -->
          <div class="border border-blue-100 p-4 rounded-lg bg-blue-50/40 relative" id="bl-box-0">
            <div class="flex justify-between items-center mb-3">
              <span class="font-bold text-blue-800">بوليصة #1</span>
              <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded cursor-pointer transition shadow-sm font-semibold inline-flex items-center gap-1" id="btn-ocr-0">
                <span>📷 سكرين شوت</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleOCR(event, 0)">
              </label>
            </div>
            <div class="space-y-2 text-sm">
              <input type="text" id="bl-0-no" placeholder="رقم البوليصة (B/L No)" class="w-full border rounded px-3 py-1.5 focus:ring-1 focus:ring-blue-500">
              <input type="text" id="bl-0-alv" placeholder="ALV Serial" class="w-full border rounded px-3 py-1.5 focus:ring-1 focus:ring-blue-500">
              <div class="grid grid-cols-3 gap-2">
                <input type="number" id="bl-0-qty" placeholder="العدد" class="border rounded px-2 py-1.5">
                <input type="number" step="0.1" id="bl-0-weight" oninput="calcTotalWeight()" placeholder="الوزن" class="border rounded px-2 py-1.5 bg-yellow-50 font-bold">
                <input type="number" id="bl-0-pallets" placeholder="البلتات" class="border rounded px-2 py-1.5">
              </div>
              <input type="text" id="bl-0-loc" placeholder="موقع البضاعة (Location)" class="w-full border rounded px-3 py-1.5">
              <input type="text" id="bl-0-company" placeholder="شركة التخليص" class="w-full border rounded px-3 py-1.5">
            </div>
          </div>

          <!-- بوليصة 2 -->
          <div class="border border-blue-100 p-4 rounded-lg bg-blue-50/40 relative" id="bl-box-1">
            <div class="flex justify-between items-center mb-3">
              <span class="font-bold text-blue-800">بوليصة #2</span>
              <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded cursor-pointer transition shadow-sm font-semibold inline-flex items-center gap-1" id="btn-ocr-1">
                <span>📷 سكرين شوت</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleOCR(event, 1)">
              </label>
            </div>
            <div class="space-y-2 text-sm">
              <input type="text" id="bl-1-no" placeholder="رقم البوليصة (B/L No)" class="w-full border rounded px-3 py-1.5">
              <input type="text" id="bl-1-alv" placeholder="ALV Serial" class="w-full border rounded px-3 py-1.5">
              <div class="grid grid-cols-3 gap-2">
                <input type="number" id="bl-1-qty" placeholder="العدد" class="border rounded px-2 py-1.5">
                <input type="number" step="0.1" id="bl-1-weight" oninput="calcTotalWeight()" placeholder="الوزن" class="border rounded px-2 py-1.5 bg-yellow-50 font-bold">
                <input type="number" id="bl-1-pallets" placeholder="البلتات" class="border rounded px-2 py-1.5">
              </div>
              <input type="text" id="bl-1-loc" placeholder="موقع البضاعة (Location)" class="w-full border rounded px-3 py-1.5">
              <input type="text" id="bl-1-company" placeholder="شركة التخليص" class="w-full border rounded px-3 py-1.5">
            </div>
          </div>

          <!-- بوليصة 3 -->
          <div class="border border-blue-100 p-4 rounded-lg bg-blue-50/40 relative" id="bl-box-2">
            <div class="flex justify-between items-center mb-3">
              <span class="font-bold text-blue-800">بوليصة #3</span>
              <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded cursor-pointer transition shadow-sm font-semibold inline-flex items-center gap-1" id="btn-ocr-2">
                <span>📷 سكرين شوت</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleOCR(event, 2)">
              </label>
            </div>
            <div class="space-y-2 text-sm">
              <input type="text" id="bl-2-no" placeholder="رقم البوليصة (B/L No)" class="w-full border rounded px-3 py-1.5">
              <input type="text" id="bl-2-alv" placeholder="ALV Serial" class="w-full border rounded px-3 py-1.5">
              <div class="grid grid-cols-3 gap-2">
                <input type="number" id="bl-2-qty" placeholder="العدد" class="border rounded px-2 py-1.5">
                <input type="number" step="0.1" id="bl-2-weight" oninput="calcTotalWeight()" placeholder="الوزن" class="border rounded px-2 py-1.5 bg-yellow-50 font-bold">
                <input type="number" id="bl-2-pallets" placeholder="البلتات" class="border rounded px-2 py-1.5">
              </div>
              <input type="text" id="bl-2-loc" placeholder="موقع البضاعة (Location)" class="w-full border rounded px-3 py-1.5">
              <input type="text" id="bl-2-company" placeholder="شركة التخليص" class="w-full border rounded px-3 py-1.5">
            </div>
          </div>
        </div>

        <div class="mt-6 flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-gray-100">
          <div class="text-lg font-bold text-gray-700">
            الوزن الإجمالي للطلب: <span id="totalWeightDisplay" class="text-blue-600 font-extrabold text-xl">0.00</span> طن
          </div>
          <button onclick="submitOrder()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md transition transform active:scale-95 flex items-center gap-2">
            <span>🚀 إرسال لشريف بالمستودع</span>
          </button>
        </div>
      </div>

      <!-- السجل -->
      <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
          <h2 class="text-lg font-bold text-gray-800">سجل الطلبات الحالية</h2>
          <div class="flex gap-2">
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded shadow transition">📊 نهاية اليوم (Excel)</button>
            <button onclick="deleteOldOrders()" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold px-4 py-2 rounded shadow transition">🗑️ حذف الأقدم من أسبوع</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-right text-sm">
            <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
              <tr>
                <th class="p-3">رقم الطلب</th>
                <th class="p-3">البوالص والمواقع</th>
                <th class="p-3">الوزن الإجمالي</th>
                <th class="p-3">الحالة</th>
                <th class="p-3">نوع السيارة المختار</th>
                <th class="p-3">الطباعة والملفات</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody" class="divide-y divide-gray-200">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- قسم المستودع -->
    <div id="section-warehouse" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
        <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">الطلبات الواردة للتحجيم</h2>
        <div id="warehouseCards" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        </div>
      </div>
    </div>
  </div>

  <script>
    let state = { employees: [], orders: [] };

    async function loadData() {
      try {
        const res = await fetch('/api/data');
        state = await res.json();
        renderEmployees();
        renderOrders();
        renderWarehouse();
      } catch (err) {
        console.error(err);
      }
    }

    function renderEmployees() {
      const select = document.getElementById('employeeSelect');
      select.innerHTML = state.employees.map(e => `<option value="${e}">${e}</option>`).join('');
    }

    async function addNewEmployee() {
      const name = prompt('أدخل اسم الموظف الجديد:');
      if (!name) return;
      await fetch('/api/employees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      loadData();
    }

    function switchTab(tab) {
      if (tab === 'cs') {
        document.getElementById('section-cs').classList.remove('hidden');
        document.getElementById('section-warehouse').classList.add('hidden');
        document.getElementById('tab-cs').className = "py-3 px-6 font-bold text-blue-600 border-b-4 border-blue-600 focus:outline-none transition";
        document.getElementById('tab-wh').className = "py-3 px-6 font-bold text-gray-500 border-b-4 border-transparent hover:text-blue-600 focus:outline-none transition";
      } else {
        document.getElementById('section-cs').classList.add('hidden');
        document.getElementById('section-warehouse').classList.remove('hidden');
        document.getElementById('tab-wh').className = "py-3 px-6 font-bold text-blue-600 border-b-4 border-blue-600 focus:outline-none transition";
        document.getElementById('tab-cs').className = "py-3 px-6 font-bold text-gray-500 border-b-4 border-transparent hover:text-blue-600 focus:outline-none transition";
      }
    }

    function calcTotalWeight() {
      let total = 0;
      for (let i = 0; i < 3; i++) {
        const val = parseFloat(document.getElementById(`bl-${i}-weight`).value) || 0;
        total += val;
      }
      document.getElementById('totalWeightDisplay').innerText = total.toFixed(2);
    }

    async function handleOCR(e, index) {
      const file = e.target.files[0];
      if (!file) return;

      const btnLabel = document.getElementById(`btn-ocr-${index}`);
      btnLabel.innerHTML = '<span>⏳ جاري القراءة...</span>';
      btnLabel.classList.add('opacity-75');

      const formData = new FormData();
      formData.append('image', file);

      try {
        const res = await fetch('/api/ocr', { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);

        document.getElementById(`bl-${index}-no`).value = data.blNumber || '';
        document.getElementById(`bl-${index}-alv`).value = data.alvSerial || '';
        document.getElementById(`bl-${index}-qty`).value = data.qty || '';
        document.getElementById(`bl-${index}-weight`).value = data.weight || '';
        document.getElementById(`bl-${index}-pallets`).value = data.pallets || '';
        document.getElementById(`bl-${index}-loc`).value = data.location || '';
        document.getElementById(`bl-${index}-company`).value = data.clearanceCompany || '';

        calcTotalWeight();
      } catch (err) {
        alert('تنبيه: ' + err.message);
      } finally {
        btnLabel.innerHTML = '<span>📷 سكرين شوت</span><input type="file" accept="image/*" class="hidden" onchange="handleOCR(event, ' + index + ')">';
        btnLabel.classList.remove('opacity-75');
      }
    }

    async function submitOrder() {
      const bls = [];
      for (let i = 0; i < 3; i++) {
        const no = document.getElementById(`bl-${i}-no`).value.trim();
        if (no) {
          bls.push({
            blNumber: no,
            alvSerial: document.getElementById(`bl-${i}-alv`).value.trim(),
            qty: document.getElementById(`bl-${i}-qty`).value.trim(),
            weight: parseFloat(document.getElementById(`bl-${i}-weight`).value) || 0,
            pallets: document.getElementById(`bl-${i}-pallets`).value.trim(),
            location: document.getElementById(`bl-${i}-loc`).value.trim(),
            clearanceCompany: document.getElementById(`bl-${i}-company`).value.trim(),
          });
        }
      }

      if (bls.length === 0) {
        alert('يرجى إدخال بيانات بوليصة واحدة على الأقل');
        return;
      }

      const totalWeight = parseFloat(document.getElementById('totalWeightDisplay').innerText) || 0;
      const createdBy = document.getElementById('employeeSelect').value;

      await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bls, totalWeight, createdBy })
      });

      for (let i = 0; i < 3; i++) {
        document.getElementById(`bl-${i}-no`).value = '';
        document.getElementById(`bl-${i}-alv`).value = '';
        document.getElementById(`bl-${i}-qty`).value = '';
        document.getElementById(`bl-${i}-weight`).value = '';
        document.getElementById(`bl-${i}-pallets`).value = '';
        document.getElementById(`bl-${i}-loc`).value = '';
        document.getElementById(`bl-${i}-company`).value = '';
      }
      calcTotalWeight();
      loadData();
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = state.orders.map(order => {
        const blDetails = order.bls.map(b => `<div class="font-semibold text-blue-900">${b.blNumber} <span class="text-xs text-gray-500">(${b.location || 'بلا موقع'})</span></div>`).join('');
        const isDone = order.status === 'تم التحجيم';
        return `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-mono font-bold">${order.id}<br><span class="text-xs text-gray-400 font-normal">${new Date(order.createdAt).toLocaleTimeString('ar-EG')}</span></td>
            <td class="p-3">${blDetails}</td>
            <td class="p-3 font-bold text-gray-800">${order.totalWeight} طن</td>
            <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${isDone ? 'badge-done' : 'badge-tahjeem'}">${order.status}</span></td>
            <td class="p-3 font-bold text-indigo-700">${order.vehicleType || '-'}</td>
            <td class="p-3">
              ${isDone ? `<button onclick="printOrderSlip('${order.id}')" class="bg-gray-800 hover:bg-black text-white px-3 py-1 rounded text-xs">🖨️ طباعة السليب</button>` : '<span class="text-gray-400 text-xs">بانتظار القياسات</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderWarehouse() {
      const container = document.getElementById('warehouseCards');
      const pending = state.orders.filter(o => o.status === 'بانتظار التحجيم');
      if (pending.length === 0) {
        container.innerHTML = '<div class="col-span-2 text-center text-gray-400 py-8 font-bold">لا توجد طلبات معلقة حالياً ✅</div>';
        return;
      }

      container.innerHTML = pending.map(order => `
        <div class="border-2 border-yellow-400 bg-yellow-50/30 rounded-xl p-5 shadow space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <span class="font-extrabold text-blue-900 text-lg">${order.id}</span>
            <span class="text-xs bg-yellow-200 text-yellow-800 font-bold px-2 py-1 rounded">الوزن: ${order.totalWeight} طن</span>
          </div>
          <div class="space-y-2">
            ${order.bls.map((b, idx) => `
              <div class="bg-white p-3 rounded border text-sm grid grid-cols-2 gap-2">
                <div><span class="text-gray-500 text-xs">بوليصة:</span> <b>${b.blNumber}</b></div>
                <div><span class="text-gray-500 text-xs">الموقع:</span> <b class="text-red-600">${b.location}</b></div>
                <div><span class="text-gray-500 text-xs">العدد:</span> ${b.qty}</div>
                <div><span class="text-gray-500 text-xs">البلتات:</span> ${b.pallets}</div>
              </div>
            `).join('')}
          </div>
          <div class="bg-white p-4 rounded-lg border space-y-3">
            <div class="font-bold text-sm text-gray-700">أدخل أبعاد التحجيم (متر):</div>
            <div class="grid grid-cols-3 gap-2">
              <input type="number" step="0.1" id="m-l-${order.id}" placeholder="الطول L" class="border rounded p-2 text-center text-sm font-bold">
              <input type="number" step="0.1" id="m-w-${order.id}" placeholder="العرض W" class="border rounded p-2 text-center text-sm font-bold">
              <input type="number" step="0.1" id="m-h-${order.id}" placeholder="الارتفاع H" class="border rounded p-2 text-center text-sm font-bold">
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
              <button onclick="confirmTahjeem('${order.id}', 'ديانا')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-sm transition">🚚 ديانا</button>
              <button onclick="confirmTahjeem('${order.id}', 'تريلا')" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded text-sm transition">🚛 تريلا</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function confirmTahjeem(id, vehicleType) {
      const l = document.getElementById(`m-l-${id}`).value;
      const w = document.getElementById(`m-w-${id}`).value;
      const h = document.getElementById(`m-h-${id}`).value;

      await fetch(`/api/orders/${id}/tahjeem`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          measurements: { length: l, width: w, height: h },
          vehicleType
        })
      });
      loadData();
    }

    function printOrderSlip(id) {
      const order = state.orders.find(o => o.id === id);
      if (!order) return;

      const printWindow = window.open('', '', 'width=800,height=600');
      printWindow.document.write(`
        <html dir="rtl">
        <head><title>سليب تحجيم - ${order.id}</title>
        <style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;margin:20px 0;}th,td{border:1px solid #ddd;padding:8px;text-align:right;}th{background:#f4f4f4;}</style>
        </head>
        <body>
          <h2>سليب تحجيم البضاعة - شركة العقبة للوجستيات</h2>
          <p><b>رقم الطلب:</b> ${order.id} | <b>التاريخ:</b> ${new Date(order.createdAt).toLocaleString('ar-EG')}</p>
          <p><b>السيارة المختارة:</b> ${order.vehicleType} | <b>الوزن الإجمالي:</b> ${order.totalWeight} طن</p>
          <p><b>القياسات:</b> طول: ${order.measurements.length || '-'}م | عرض: ${order.measurements.width || '-'}م | ارتفاع: ${order.measurements.height || '-'}م</p>
          <table>
            <tr><th>رقم البوليصة</th><th>ALV Serial</th><th>العدد</th><th>الوزن</th><th>البلتات</th><th>الموقع</th><th>شركة التخليص</th></tr>
            ${order.bls.map(b => `<tr><td>${b.blNumber}</td><td>${b.alvSerial}</td><td>${b.qty}</td><td>${b.weight}</td><td>${b.pallets}</td><td>${b.location}</td><td>${b.clearanceCompany}</td></tr>`).join('')}
          </table>
          <script>window.print();<\/script>
        </body></html>
      `);
      printWindow.document.close();
    }

    function exportToExcel() {
      const data = [];
      state.orders.forEach(o => {
        o.bls.forEach(b => {
          data.push({
            'رقم الطلب': o.id,
            'التاريخ': new Date(o.createdAt).toLocaleDateString('ar-EG'),
            'منشئ الطلب': o.createdBy,
            'الحالة': o.status,
            'نوع السيارة': o.vehicleType || '-',
            'رقم البوليصة': b.blNumber,
            'ALV Serial': b.alvSerial,
            'العدد': b.qty,
            'الوزن (طن)': b.weight,
            'البلتات': b.pallets,
            'الموقع': b.location,
            'شركة التخليص': b.clearanceCompany
          });
        });
      });
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "الطلبات");
      XLSX.writeFile(wb, `طلبات_التحجيم_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    async function deleteOldOrders() {
      if (!confirm('هل أنت متأكد من حذف الطلبات الأقدم من أسبوع؟')) return;
      await fetch('/api/orders/old', { method: 'DELETE' });
      loadData();
    }

    setInterval(loadData, 3000);
    loadData();
  </script>
