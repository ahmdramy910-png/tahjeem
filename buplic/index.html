<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة طلبات التحجيم - العقبة اللوجستية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">📦 نظام طلبات التحجيم (LCL)</h1>
    <div class="flex items-center gap-3">
      <label class="text-sm">الموظف الحالي:</label>
      <select id="currentEmployee" class="text-black bg-white rounded px-2 py-1 text-sm font-semibold"></select>
      <button onclick="addEmployeePrompt()" class="bg-blue-700 hover:bg-blue-600 px-2 py-1 rounded text-sm">+ موظف جديد</button>
    </div>
  </header>

  <div class="max-w-7xl mx-auto mt-4 px-4 flex gap-4 border-b border-gray-300">
    <button onclick="switchTab('cs')" id="tab-cs" class="py-2 px-4 font-bold border-b-4 border-blue-900 text-blue-900">قسم خدمة العملاء (Customer Service)</button>
    <button onclick="switchTab('wh')" id="tab-wh" class="py-2 px-4 font-bold text-gray-500 hover:text-blue-900">شاشة المستودع (شريف - التحجيم)</button>
  </div>

  <main class="max-w-7xl mx-auto p-4">
    <section id="view-cs" class="space-y-6">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-lg font-bold text-blue-900 mb-4 border-b pb-2">إنشاء طلب تحجيم جديد (حتى 3 بوالص)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4" id="blFormsContainer">
          </div>

        <div class="flex justify-between items-center bg-gray-50 p-4 rounded border">
          <div class="text-lg font-bold">الوزن الإجمالي للطلب: <span id="totalWeightDisplay" class="text-blue-700">0</span> طن</div>
          <div class="flex gap-2">
            <button onclick="saveAndSendOrder()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded">إرسال لشريف بالمستودع 🚀</button>
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-gray-800">سجل الطلبات الحالية</h2>
          <div class="flex gap-2">
            <button onclick="exportToExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded text-sm font-bold">📊 نهاية اليوم (Excel)</button>
            <button onclick="deleteOldOrders()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm">🗑️ حذف الأقدم من أسبوع</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-right border-collapse">
            <thead>
              <tr class="bg-gray-100 border-b text-sm">
                <th class="p-3">رقم الطلب</th>
                <th class="p-3">البوالص والمواقع</th>
                <th class="p-3">الوزن الإجمالي</th>
                <th class="p-3">الحالة</th>
                <th class="p-3">نوع السيارة المختار</th>
                <th class="p-3">الطباعة والملفات</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody" class="divide-y text-sm"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="view-wh" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-lg font-bold text-gray-800 mb-4">قائمة الشحنات بانتظار القياس بالمستودع</h2>
        <div id="warehouseOrdersList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>
  </main>

  <script>
    let state = { employees: [], orders: [] };

    async function loadData() {
      try {
        const res = await fetch('/api/data');
        state = await res.json();
        renderEmployees();
        renderOrders();
        renderWarehouseOrders();
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    function switchTab(tab) {
      document.getElementById('view-cs').classList.toggle('hidden', tab !== 'cs');
      document.getElementById('view-wh').classList.toggle('hidden', tab !== 'wh');
      document.getElementById('tab-cs').className = tab === 'cs' ? 'py-2 px-4 font-bold border-b-4 border-blue-900 text-blue-900' : 'py-2 px-4 font-bold text-gray-500 hover:text-blue-900';
      document.getElementById('tab-wh').className = tab === 'wh' ? 'py-2 px-4 font-bold border-b-4 border-blue-900 text-blue-900' : 'py-2 px-4 font-bold text-gray-500 hover:text-blue-900';
    }

    function renderEmployees() {
      const select = document.getElementById('currentEmployee');
      select.innerHTML = state.employees.map(e => `<option value="${e}">${e}</option>`).join('');
    }

    async function addEmployeePrompt() {
      const name = prompt('أدخل اسم الموظف الجديد:');
      if (name) {
        await fetch('/api/employees', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        loadData();
      }
    }

    // تجهيز نماذج الـ 3 بوالص مع رفع السكرين شوت
    function initBLForms() {
      const container = document.getElementById('blFormsContainer');
      container.innerHTML = [1, 2, 3].map(i => `
        <div class="border rounded p-3 bg-gray-50 space-y-2">
          <div class="font-bold text-sm text-blue-800 flex justify-between items-center">
            <span>بوليصة #${i}</span>
            <input type="file" id="file-${i}" class="hidden" accept="image/*" onchange="handleOCR(event, ${i})">
            <button onclick="document.getElementById('file-${i}').click()" class="bg-indigo-600 text-white px-2 py-1 text-xs rounded hover:bg-indigo-700">📷 سكرين شوت</button>
          </div>
          <input type="text" id="bl-${i}-no" placeholder="رقم البوليصة (B/L No)" class="w-full text-xs p-1.5 border rounded">
          <input type="text" id="bl-${i}-alv" placeholder="ALV Serial" class="w-full text-xs p-1.5 border rounded">
          <div class="grid grid-cols-3 gap-1">
            <input type="number" id="bl-${i}-qty" placeholder="العدد" class="text-xs p-1.5 border rounded">
            <input type="number" step="0.1" id="bl-${i}-weight" placeholder="الوزن" oninput="calcTotalWeight()" class="text-xs p-1.5 border rounded">
            <input type="number" id="bl-${i}-pallets" placeholder="البلتات" class="text-xs p-1.5 border rounded">
          </div>
          <input type="text" id="bl-${i}-loc" placeholder="موقع البضاعة (Location)" class="w-full text-xs p-1.5 border rounded">
          <input type="text" id="bl-${i}-company" placeholder="شركة التخليص" class="w-full text-xs p-1.5 border rounded">
        </div>
      `).join('');
    }

    // إرسال السكرين شوت للسيرفر واستخراج البيانات
    async function handleOCR(e, index) {
      const file = e.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('image', file);

      alert(`جاري استخراج بيانات البوليصة #${index} عبر الذكاء الاصطناعي...`);
      try {
        const res = await fetch('/api/ocr', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        document.getElementById(`bl-${index}-no`).value = data.blNumber || '';
        document.getElementById(`bl-${index}-alv`).value = data.alvSerial || '';
        document.getElementById(`bl-${index}-qty`).value = data.qty || '';
        document.getElementById(`bl-${index}-weight`).value = data.weight || '';
        document.getElementById(`bl-${index}-pallets`).value = data.pallets || '';
        document.getElementById(`bl-${index}-loc`).value = data.location || '';
        document.getElementById(`bl-${index}-company`).value = data.clearanceCompany || '';
        calcTotalWeight();
      } catch (err) {
        alert('خطأ أثناء قراءة الصورة: ' + err.message);
      }
    }

    function calcTotalWeight() {
      let total = 0;
      [1, 2, 3].forEach(i => {
        const w = parseFloat(document.getElementById(`bl-${i}-weight`).value) || 0;
        total += w;
      });
      document.getElementById('totalWeightDisplay').innerText = total.toFixed(2);
    }

    async function saveAndSendOrder() {
      const bls = [];
      [1, 2, 3].forEach(i => {
        const blNo = document.getElementById(`bl-${i}-no`).value;
        if (blNo) {
          bls.push({
            blNo,
            alvSerial: document.getElementById(`bl-${i}-alv`).value,
            qty: document.getElementById(`bl-${i}-qty`).value,
            weight: document.getElementById(`bl-${i}-weight`).value,
            pallets: document.getElementById(`bl-${i}-pallets`).value,
            location: document.getElementById(`bl-${i}-loc`).value,
            company: document.getElementById(`bl-${i}-company`).value
          });
        }
      });

      if (bls.length === 0) return alert('الرجاء إدخال بوليصة واحدة على الأقل');

      await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          createdBy: document.getElementById('currentEmployee').value,
          bls,
          totalWeight: parseFloat(document.getElementById('totalWeightDisplay').innerText)
        })
      });

      initBLForms();
      calcTotalWeight();
      loadData();
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = state.orders.map(o => `
        <tr class="hover:bg-gray-50">
          <td class="p-3 font-bold">${o.id}</td>
          <td class="p-3">
            ${o.bls.map(b => `<div class="text-xs">📌 ${b.blNo} | موقع: <b>${b.location}</b> (${b.company})</div>`).join('')}
          </td>
          <td class="p-3 font-semibold">${o.totalWeight} طن</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded text-xs ${o.status === 'تم التحجيم' ? 'bg-green-100 text-green-800 font-bold' : 'bg-yellow-100 text-yellow-800'}">
              ${o.status}
            </span>
          </td>
          <td class="p-3 font-bold text-blue-900">${o.vehicleType || '-'}</td>
          <td class="p-3 flex gap-2">
            <button onclick="downloadWord('${o.id}', 'initial')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-2 py-1 rounded text-xs">📄 مبدئي</button>
            ${o.status === 'تم التحجيم' ? `<button onclick="downloadWord('${o.id}', 'final')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs font-bold">📄 نهائي للمخلص</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    function renderWarehouseOrders() {
      const container = document.getElementById('warehouseOrdersList');
      const pending = state.orders.filter(o => o.status === 'بانتظار التحجيم');
      if (pending.length === 0) {
        container.innerHTML = '<div class="col-span-2 text-center text-gray-500 py-8">لا توجد طلبات معلقة بانتظار القياس حالياً ✅</div>';
        return;
      }

      container.innerHTML = pending.map(o => `
        <div class="border-2 border-blue-300 rounded-lg p-4 bg-white shadow space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <span class="font-bold text-blue-900">${o.id}</span>
            <span class="text-xs text-gray-500">${o.createdAt.slice(11, 16)}</span>
          </div>
          <div class="space-y-1">
            ${o.bls.map(b => `
              <div class="bg-gray-50 p-2 rounded text-xs border">
                <div><b>رقم:</b> ${b.blNo} | <b>ALV:</b> ${b.alvSerial}</div>
                <div><b>الموقع:</b> <span class="text-red-600 font-bold">${b.location}</span> | <b>البلتات:</b> ${b.pallets} | <b>الوزن:</b> ${b.weight}</div>
              </div>
            `).join('')}
          </div>
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="wh-l-${o.id}" placeholder="الطول (م)" class="p-1.5 border rounded text-xs">
            <input type="text" id="wh-w-${o.id}" placeholder="العرض (م)" class="p-1.5 border rounded text-xs">
            <input type="text" id="wh-h-${o.id}" placeholder="الارتفاع (م)" class="p-1.5 border rounded text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">نوع السيارة المطلوب:</label>
            <select id="wh-v-${o.id}" class="w-full p-2 border rounded text-sm bg-blue-50 font-bold">
              <option value="بنقو">بنقو</option>
              <option value="ديانا">ديانا</option>
              <option value="LB">LB</option>
              <option value="سنقل">سنقل</option>
              <option value="تريلا">تريلا</option>
            </select>
          </div>
          <input type="text" id="wh-notes-${o.id}" placeholder="ملاحظات شريف..." class="w-full p-1.5 border rounded text-xs">
          <button onclick="submitTahjeem('${o.id}')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded text-sm">اعتماد التحجيم ✅</button>
        </div>
      `).join('');
    }

    async function submitTahjeem(orderId) {
      const length = document.getElementById(`wh-l-${orderId}`).value;
      const width = document.getElementById(`wh-w-${orderId}`).value;
      const height = document.getElementById(`wh-h-${orderId}`).value;
      const vehicleType = document.getElementById(`wh-v-${orderId}`).value;
      const shareefNotes = document.getElementById(`wh-notes-${orderId}`).value;

      await fetch(`/api/orders/${orderId}/tahjeem`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          measurements: { length, width, height },
          vehicleType,
          shareefNotes
        })
      });
      loadData();
    }

    // توليد ملف Word حقيقي (.docx)
    function downloadWord(orderId, type) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;

      const { Document, Packer, Paragraph, Table, TableRow, TableCell, WidthType, AlignmentType, HeadingLevel } = docx;

      const doc = new Document({
        sections: [{
          properties: { page: { margin: { top: 720, right: 720, bottom: 720, left: 720 } } },
          children: [
            new Paragraph({ text: "شركة العقبة اللوجستية - نموذج طلب تحجيم", heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER }),
            new Paragraph({ text: `رقم الطلب: ${order.id} | التاريخ: ${new Date().toLocaleDateString('ar-JO')}`, alignment: AlignmentType.CENTER }),
            new Paragraph({ text: "" }),
            new Table({
              width: { size: 100, type: WidthType.PERCENTAGE },
              rows: [
                new TableRow({
                  children: ["رقم البوليصة", "ALV Serial", "العدد", "البلتات", "الوزن (طن)", "الموقع", "شركة التخليص"].map(t => 
                    new TableCell({ children: [new Paragraph({ text: t, alignment: AlignmentType.CENTER })] })
                  )
                }),
                ...order.bls.map(b => new TableRow({
                  children: [b.blNo, b.alvSerial, b.qty, b.pallets, b.weight, b.location, b.company].map(val => 
                    new TableCell({ children: [new Paragraph({ text: String(val || '-'), alignment: AlignmentType.CENTER })] })
                  )
                }))
              ]
            }),
            new Paragraph({ text: "" }),
            new Paragraph({ text: `الوزن الإجمالي: ${order.totalWeight} طن`, alignment: AlignmentType.RIGHT }),
            new Paragraph({ text: `القياسات (طول × عرض × ارتفاع): ${type === 'final' ? `${order.measurements.length} × ${order.measurements.width} × ${order.measurements.height}` : '..............................'}`, alignment: AlignmentType.RIGHT }),
            new Paragraph({ text: `نوع السيارة المعتمد: ${type === 'final' ? order.vehicleType : '..............................'}`, alignment: AlignmentType.RIGHT }),
            new Paragraph({ text: `ملاحظات: ${order.shareefNotes || '-'}`, alignment: AlignmentType.RIGHT })
          ]
        }]
      });

      Packer.toBlob(doc).then(blob => {
        saveAs(blob, `طلب_تحجيم_${order.id}_${type}.docx`);
      });
    }

    function exportToExcel() {
      const data = state.orders.map(o => ({
        "رقم الطلب": o.id,
        "التاريخ": o.createdAt,
        "المنشئ": o.createdBy,
        "الوزن الإجمالي": o.totalWeight,
        "نوع السيارة": o.vehicleType,
        "الأبعاد": `${o.measurements.length}x${o.measurements.width}x${o.measurements.height}`,
        "الحالة": o.status
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "تقرير اليوم");
      XLSX.writeFile(wb, `تقرير_التحجيم_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    async function deleteOldOrders() {
      if (confirm('هل أنت متأكد من حذف الطلبات الأقدم من أسبوع؟')) {
        await fetch('/api/orders/old', { method: 'DELETE' });
        loadData();
      }
    }

    // تشغيل تلقائي ومزامنة كل 4 ثوانٍ
    initBLForms();
    loadData();
    setInterval(loadData, 4000);
  </script>
</body>
</html>
